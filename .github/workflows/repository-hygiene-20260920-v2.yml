name: One-time repository hygiene
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-hygiene-20260920-v2.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  deployments: write
  pull-requests: read
concurrency:
  group: owner-requested-repository-hygiene
  cancel-in-progress: false
jobs:
  clean:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: run requested repository hygiene'
    uses: NosytLabs/employee-md/.github/workflows/repository-hygiene-worker.yml@bd6d468c2dbb3635ce9fe727709ec28b60086bb7
    with:
      expected_repository: NosytLabs/skillstate-proxy
