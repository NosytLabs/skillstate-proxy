name: One-time Actions cost containment
# This owner-requested helper disables itself before cleanup.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-cost-stop-20260920.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: owner-requested-actions-cost-stop
  cancel-in-progress: false
jobs:
  stop:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: apply requested Actions cost containment'
    uses: NosytLabs/employee-md/.github/workflows/actions-cost-control-worker.yml@70d83a756e7d04481dc46e2560832e82ad7c335d
    with:
      expected_repository: NosytLabs/skillstate-proxy
