name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke test packed package
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP" "$TARBALL"' EXIT
          npm install --prefix "$TMP" "$PWD/$TARBALL" --ignore-scripts --no-audit --no-fund
          "$TMP/node_modules/.bin/skillstate" --version
          "$TMP/node_modules/.bin/skillstate-proxy" --version
          "$TMP/node_modules/.bin/skillstate" --help >/dev/null
