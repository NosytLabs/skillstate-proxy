name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke test packed package
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP" "$TARBALL"' EXIT
          npm install --prefix "$TMP" "$PWD/$TARBALL" --ignore-scripts --no-audit --no-fund
          "$TMP/node_modules/.bin/skillstate" --version
          "$TMP/node_modules/.bin/skillstate-proxy" --version
          "$TMP/node_modules/.bin/skillstate" --help >/dev/null
