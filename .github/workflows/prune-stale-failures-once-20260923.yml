name: Prune stale failed runs once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-stale-failures-once-20260923.yml']
permissions:
  contents: read
  actions: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete completed failed runs older than six hours
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=failure&per_page=100" --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id")"
          count=0
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
            count=$((count+1))
          done
          echo "Deleted $count stale failed workflow runs."
