name: Apply reviewed state validation
on:
  push:
    branches: [fix/state-data-validation-20260913]
permissions:
  contents: read
jobs:
  apply:
    if: github.actor == 'NosytLabs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply checked source patch only to its reviewed baseline
        run: |
          test "$(git rev-parse HEAD^)" = fc6e5dd3e0c5c25cf5ed3af09702a766a5021f69
          python - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          payload = ''''''
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '8e1bc0e0bd7d21e296f14e4dc5b7d18077eb53ecc86f1de8c09a31db3d5e2a0a'
          path = Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Commit only the reviewed source and remove this temporary helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/apply-reviewed-state-fix.yml
          git add -- docs/hardening-review.md docs/index.html src/config.ts src/json-state.ts src/proxy.ts src/session-store.ts src/state.ts test/state-data-validation.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate initial and persisted state and reject unsafe JSON data'
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$GH_TOKEN";; esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push origin HEAD:refs/heads/fix/state-data-validation-20260913
